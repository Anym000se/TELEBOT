# Copy this file to config.toml and fill it in.

# From https://my.telegram.org > "API development tools" (log in with your own number).
api_id = 1234567
api_hash = "your_api_hash"

# Who gets the texts: her @username, or a phone number that's saved in your contacts.
recipient = "@her_username"

# Times below are in this timezone. Use a name from
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone = "America/New_York"

# If you've already texted her yourself in the last N minutes, skip the scheduled
# text so it doesn't look weird. Set to 0 to always send.
skip_if_i_texted_within_minutes = 90

[ai]
# Have Claude write each text instead of picking one from the lists below. It reads
# your recent chat so the texts fit what's going on ("good luck on the exam today!"),
# copies how you text, and skips a text if it would land badly (like mid-argument).
# The lists below are still used as examples, and as a backup if the AI is unreachable.
enabled = true

# Get a key at https://platform.claude.com, then either put it here or set the
# ANTHROPIC_API_KEY environment variable. Calendar sync below uses this key too,
# even if enabled = false here.
# api_key = "sk-ant-..."

# claude-opus-5-5 writes the best texts. claude-sonnet-5-5 costs about half as much.
model = "claude-opus-5-5"

# Let Claude read your latest messages with her. This sends those messages to
# Anthropic's API. Set to false and it only uses about_us and the examples.
read_recent_chat = true

# How many of the latest messages it reads (never more than 3 days back).
# Calendar sync reads the same amount.
read_last_messages = 10

# The more specific this is, the less generic the texts. Fill in the blanks.
about_us = """
Her name is ___. I call her ___.
We've been together ___.
Things she's into: ___.
How I text: ___ (e.g. all lowercase, short, barely any emojis)
"""

[calendar]
# When you two make plans in the chat ("dinner at luigi's saturday at 7?" / "yes!!"),
# put them on your Google Calendar, and move or remove them if the plans change.
# Things she has coming up (her exam, her flight) get added too. Needs a one-time
# Google setup; see "Google Calendar" in README.md.
enabled = true

# "primary" is your main calendar. To keep these separate, make a new calendar in
# Google Calendar and paste its ID here (Settings > that calendar > Integrate calendar).
# With a service-account key, "primary" won't work: put your Gmail address here instead.
calendar_id = "primary"

# Send yourself a note in Saved Messages whenever it adds, moves, or removes something.
notify_me = true

# Calendars other people share with you, shown in your morning brief ("Raya today: ...").
# The bot only ever reads these. It never adds to or changes them. Their event titles do go
# to Claude for the "ask her about" part. Find a calendar's ID in Google Calendar: Settings >
# click that calendar on the left > "Integrate calendar" > Calendar ID. To use it, delete the
# # at the start of both lines.
# [calendar.also_read]
# Raya = "her-calendar-id@gmail.com"

[auto_reply]
# If she texts and you haven't replied after a while, send ONE short holding reply in your
# style ("sorry got caught up, will text you properly soon"). It never answers questions,
# agrees to plans, or says what you're doing, and it won't send another until you've
# replied yourself. If her message seems serious, it doesn't reply and tells you instead.
# Uses the Anthropic key from [ai] and reads the same number of latest messages.
enabled = false

# How long she waits, from her first unanswered message, before it replies.
after_minutes = 30

# Don't auto-reply between these times (you'd be asleep). Use [] to allow any time.
quiet_hours = ["23:30", "07:30"]

# Send yourself a note in Saved Messages whenever it replies for you, or decides not to.
notify_me = true

[reminders]
# A buzz on your phone before plans on your calendar. Needs [calendar] on.
enabled = true
minutes_before = 60
# true: only plans the bot added from your chat. false: everything on your calendar.
only_plans_from_chat = true

[morning_brief]
# Every morning, a private note in Saved Messages that buzzes your phone: today's plans,
# important dates coming up (see [[dates]] below), things she mentioned that you could
# ask about, and once a week some date ideas. Uses the Anthropic key from [ai].
enabled = true
at = "08:00"
# Which day you get date ideas. Use "" for never.
date_ideas_on = "thursday"

# Important dates show up in the morning brief: a heads-up a few days before, then on
# the day. Copy the block for each one, and delete the # at the start of each line.
# `every = "month"` counts monthly anniversaries (3 months, 4 months, ... then 1 year).
# `every = "year"` is for birthdays and yearly anniversaries.
#
# [[dates]]
# name = "our anniversary"
# date = "2026-08-02"
# every = "month"
# heads_up_days = 3
#
# [[dates]]
# name = "her birthday"
# date = "2006-03-14"
# every = "year"
# heads_up_days = 7

# Each [[schedule]] is one text per day, sent at a random time inside `between`
# (so it's not suspiciously 8:00:00 every morning). A window can run past midnight,
# e.g. ["23:30", "00:30"]. Add, remove, or rename slots however you like.
#
# `chance` (optional) is how often the slot fires: 0.5 means about every other day.

[[schedule]]
name = "good morning"
between = ["07:30", "09:00"]
messages = [
  "good morning beautiful ☀️",
  "morning babe, hope you slept well",
  "good morning ❤️ have the best day today",
  "rise and shine gorgeous",
  "morning! can't wait to see you",
  "good morning, you're the first thing on my mind",
]

[[schedule]]
name = "thinking of you"
between = ["12:00", "17:00"]
chance = 0.5
messages = [
  "hey, just thinking about you 🥰",
  "miss you",
  "hope your day's going good",
  "random reminder that I love you",
  "can't stop thinking about you lol",
  "you're the best, you know that?",
]

[[schedule]]
name = "goodnight"
between = ["22:30", "23:30"]
messages = [
  "goodnight babe ❤️ sweet dreams",
  "night beautiful, talk tomorrow",
  "goodnight, love you 😘",
  "sleep well, dream of me lol",
  "night night 💤",
]
